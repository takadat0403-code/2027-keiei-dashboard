name: dashboard-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependency
        run: pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm install
      - name: Regenerate dashboard data when workbook is present
        shell: bash
        run: |
          if [ -f "data/source/2027年度_経営改革ダッシュボード_土台.xlsx" ]; then
            npm run data:sync
          else
            echo "Source workbook is not committed; using checked-in src/data/dashboard.json"
          fi
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
